<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>6. liga – Los a termínový kalendář 2026/27</title>
<style>
  :root{
    --bg:#0b0c12; --surf:#14161f; --surf2:#1b1e29; --ink:#eef0f7; --muted:#868da3; --line:rgba(255,255,255,.09);
    --team:#ff5a3c; --win:#33d69f; --loss:#ff5d6c;
    --tp:100%; /* kolik z barvy zůstane v textu (dark = plná) */
    --font:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"Cascadia Mono","Consolas",monospace;
  }
  body.light{
    --bg:#eef0f5; --surf:#ffffff; --surf2:#f4f6fa; --ink:#151824; --muted:#5f6982; --line:rgba(15,20,35,.11);
    --tp:52%; /* v light režimu barvy ztmavíme, ať jsou čitelné */
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:var(--font); color:var(--ink); line-height:1.5; min-height:100vh;
    background:radial-gradient(1200px 620px at 50% -260px, color-mix(in srgb,var(--team) 16%, transparent), transparent 68%), var(--bg);
    background-attachment:fixed; -webkit-font-smoothing:antialiased;
    transition:background-color .3s ease;
  }
  a{color:color-mix(in srgb,var(--team) var(--tp),#000);text-decoration:none}
  a:hover{text-decoration:underline}
  b{font-weight:700}

  /* ---------- HEADER ---------- */
  header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .bar{max-width:1100px;margin:0 auto;padding:13px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:18px;letter-spacing:-.01em}
  .brand .ball{width:26px;height:26px;border-radius:50%;flex:none;
    background:radial-gradient(circle at 34% 32%, #fff, var(--team) 78%);box-shadow:0 0 16px color-mix(in srgb,var(--team) 55%,transparent)}
  .brand small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;letter-spacing:.01em;margin-top:1px}
  .spacer{flex:1}
  .pick{display:flex;align-items:center;gap:8px}
  .pick label{font-size:12px;color:var(--muted);font-weight:600}
  select,input[type=date],.btn{
    font:inherit;font-size:13.5px;padding:9px 13px;border:1px solid var(--line);border-radius:11px;
    background:var(--surf2);color:var(--ink);cursor:pointer;transition:border-color .2s,background .2s}
  select:hover,input:hover,.btn:hover{border-color:color-mix(in srgb,var(--team) 60%,var(--line))}
  select:focus,input:focus{outline:2px solid var(--team);outline-offset:0}
  .btn{font-weight:700;display:inline-flex;align-items:center;gap:7px}
  .iconbtn{padding:9px 11px}.iconbtn svg{display:block}

  nav.tabs{max-width:1100px;margin:0 auto;padding:0 22px;display:flex;gap:6px}
  nav.tabs button{
    font:inherit;font-weight:700;font-size:14px;border:none;background:none;color:var(--muted);
    padding:13px 6px;cursor:pointer;position:relative}
  nav.tabs button::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:transparent;transition:background .2s}
  nav.tabs button.on{color:var(--ink)}
  nav.tabs button.on::after{background:var(--team)}
  nav.tabs button:hover{color:var(--ink)}

  main{max-width:1100px;margin:0 auto;padding:26px 22px 90px}
  section{display:none}
  section.on{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  h1{font-size:13px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--muted);margin:0 0 16px;display:flex;align-items:center;gap:9px}
  h1::before{content:"";width:20px;height:3px;border-radius:2px;background:var(--team)}

  .lab{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}

  /* ---------- HERO ---------- */
  .hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:22px;margin-bottom:24px;padding:26px;
    background:linear-gradient(135deg, color-mix(in srgb,var(--team) 24%, var(--surf)) 0%, var(--surf) 55%);
    display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:start}
  .hero::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;
    background:radial-gradient(circle,color-mix(in srgb,var(--team) 40%,transparent),transparent 68%);pointer-events:none}
  .numbadge{position:relative;z-index:1;width:84px;height:84px;border-radius:22px;display:grid;place-items:center;
    background:var(--team);color:#0b0c12;font-size:42px;font-weight:900;letter-spacing:-.03em;
    box-shadow:0 12px 30px color-mix(in srgb,var(--team) 45%,transparent)}
  .hero .hz{position:relative;z-index:1}
  .hero .name{font-size:27px;font-weight:900;letter-spacing:-.02em;margin:2px 0 0;line-height:1.05}
  .hero .sub{color:var(--muted);font-size:13.5px;margin-top:9px}
  .hero .facts{display:flex;flex-wrap:wrap;gap:20px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
  .hero .facts>div{display:flex;flex-direction:column;gap:3px}
  .hero .facts>div>span:last-child{font-size:14px;font-weight:600}
  .next{grid-column:1/-1;position:relative;z-index:1;margin-top:18px;border-radius:15px;padding:15px 18px;
    background:color-mix(in srgb,var(--team) 15%, var(--surf2));border:1px solid color-mix(in srgb,var(--team) 38%,transparent);
    display:flex;flex-direction:column;gap:6px}
  .next .nx-lbl{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:color-mix(in srgb,var(--team) var(--tp),#000)}
  .next .nx-main{font-size:18px;font-weight:800;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
  .next .nx-meta{color:var(--muted);font-size:13px}

  .empty{border:1px solid var(--line);border-radius:20px;padding:60px 24px;text-align:center;color:var(--muted);background:var(--surf)}
  .empty .ball{width:44px;height:44px;border-radius:50%;margin:0 auto 16px;background:radial-gradient(circle at 34% 32%,#fff,var(--team) 78%);box-shadow:0 0 26px color-mix(in srgb,var(--team) 55%,transparent)}
  .empty b{display:block;color:var(--ink);font-size:18px;font-weight:800;margin-bottom:6px}

  /* ---------- TIMELINE ---------- */
  .subhead{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:8px 0 16px}
  .timeline{position:relative}
  .tl-row{display:grid;grid-template-columns:60px 24px 1fr;gap:11px;align-items:stretch}
  .tl-date{display:flex;flex-direction:column;align-items:flex-end;text-align:right;padding-top:16px;line-height:1.2}
  .tl-date b{font-weight:800;font-size:13.5px;color:var(--ink);letter-spacing:-.01em}
  .tl-date span{font-size:11px;color:var(--muted)}
  .tl-date .yr{font-size:9.5px;opacity:.7;letter-spacing:.02em}
  .tl-axis{position:relative;display:flex;justify-content:center}
  .tl-axis::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line)}
  .tl-row:first-child .tl-axis::before{top:22px}
  .tl-row:last-child .tl-axis::before{bottom:calc(100% - 22px)}
  .dot{position:relative;z-index:2;width:15px;height:15px;border-radius:50%;margin-top:19px;
    background:var(--oc,var(--muted));box-shadow:0 0 0 4px color-mix(in srgb,var(--oc,var(--muted)) 20%,transparent)}
  .dot.nt,.dot.holiday{background:transparent;border:2px solid var(--muted);box-shadow:none;width:13px;height:13px}
  .dot.holiday{border-style:dashed}

  .tl-card{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:var(--surf);padding:15px 17px;margin:8px 0;transition:transform .15s ease,box-shadow .2s ease,border-color .2s ease}
  .mcard{border-left:4px solid var(--oc);padding-left:18px}
  .mcard:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.28)}
  .ghost{position:absolute;top:-14px;right:10px;font-size:74px;font-weight:900;line-height:1;letter-spacing:-.05em;color:var(--oc);opacity:.10;pointer-events:none;user-select:none}
  .mc-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .round{font-size:12.5px;font-weight:800;letter-spacing:.02em;color:var(--ink)}
  .round b{color:color-mix(in srgb,var(--oc) var(--tp),#000);font-size:15px}
  .round i{color:var(--muted);font-weight:600;font-style:normal;margin-left:6px}
  .flag{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#0b0c12;background:var(--oc);padding:3px 8px;border-radius:999px}

  .mc-team{display:flex;align-items:center;gap:12px;margin:13px 0;flex-wrap:wrap}
  .ha{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:6px 12px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
  .ha svg{width:13px;height:13px}
  .ha.home{background:var(--oc);color:#0b0c12}
  .ha.away{background:transparent;color:color-mix(in srgb,var(--oc) var(--tp),#000);border:1.5px solid color-mix(in srgb,var(--oc) 55%,transparent)}
  .opp{display:inline-flex;align-items:center;gap:10px;font-size:21px;font-weight:900;letter-spacing:-.02em;line-height:1.05}
  .dotnum{font-size:13px;font-weight:800;color:#0b0c12;background:var(--oc);width:28px;height:28px;border-radius:9px;display:inline-grid;place-items:center;flex:none}

  .infogrid{display:flex;flex-direction:column;gap:8px;padding-top:13px;border-top:1px solid var(--line)}
  .info{display:flex;gap:10px;font-size:13px;align-items:flex-start;color:var(--ink)}
  .info svg{width:16px;height:16px;flex:none;margin-top:2px;fill:none;stroke:color-mix(in srgb,var(--oc) var(--tp),#000);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.95}
  .info .m{color:var(--muted)}
  .info.alt span{color:var(--muted);font-size:12px}
  .info.alt svg{opacity:.7}
  .roster-line{display:flex;gap:10px;align-items:flex-start;margin-top:11px}
  .roster-line svg{width:16px;height:16px;flex:none;margin-top:4px;fill:none;stroke:color-mix(in srgb,var(--oc) var(--tp),#000);stroke-width:1.8;opacity:.95}
  .rlist{display:flex;flex-wrap:wrap;gap:6px}
  .rp{display:inline-flex;align-items:center;gap:5px;background:var(--surf2);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 7px;font-size:12px;white-space:nowrap}
  .lastseason{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-top:12px;padding-top:11px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
  .lastseason .lstxt b{color:var(--ink);font-weight:700}
  .lastseason .wdl{margin-left:auto;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
  .trend{font-size:11px}.trend.up{color:color-mix(in srgb,var(--win) var(--tp),#000)}.trend.down{color:color-mix(in srgb,var(--loss) var(--tp),#000)}.trend.stay{color:var(--muted)}
  .w{color:color-mix(in srgb,var(--win) var(--tp),#000)}.d{color:var(--muted)}.l{color:color-mix(in srgb,var(--loss) var(--tp),#000)}
  .pwl{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;margin-left:3px;padding-left:7px;border-left:1px solid var(--line)}
  .pwl.none{color:var(--muted);font-weight:600}

  .mc-foot{display:flex;justify-content:flex-end;margin-top:12px}
  .played{display:inline-flex;align-items:center;gap:9px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
  .played input{position:absolute;opacity:0;width:0;height:0}
  .played .switch{width:40px;height:22px;border-radius:999px;background:var(--surf2);border:1px solid var(--line);position:relative;transition:.2s;flex:none}
  .played .switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:.2s}
  .played input:checked + .switch{background:var(--oc);border-color:var(--oc)}
  .played input:checked + .switch::after{transform:translateX(18px);background:#0b0c12}
  .played input:focus-visible + .switch{outline:2px solid var(--oc);outline-offset:2px}
  .played input:checked ~ .pl-txt{color:color-mix(in srgb,var(--oc) var(--tp),#000)}
  .tl-card.done{opacity:.62}
  .tl-card.done .opp{text-decoration:line-through;text-decoration-thickness:2px}

  .tl-card.cur{border-color:var(--oc);box-shadow:0 0 0 1px var(--oc),0 12px 34px color-mix(in srgb,var(--oc) 26%,transparent)}
  .tl-row.cur .dot{box-shadow:0 0 0 5px color-mix(in srgb,var(--oc) 26%,transparent),0 0 18px color-mix(in srgb,var(--oc) 50%,transparent)}

  .tl-card.slim{background:transparent;border-style:dashed;padding:12px 16px}
  .tl-card.slim .r1{display:flex;align-items:center;gap:11px;flex-wrap:wrap;font-size:13.5px;font-weight:700;color:var(--muted)}
  .tl-card.slim .r1 .flag{color:#0b0c12;background:var(--team)}
  .tl-card.holiday{border-color:color-mix(in srgb,var(--team) 34%,var(--line))}
  .tl-card .r2{font-size:12px;color:var(--muted);margin-top:4px}

  .today-marker{display:grid;grid-template-columns:60px 24px 1fr;gap:11px;align-items:center;margin:6px 0}
  .today-marker .tl-date{flex-direction:row;justify-content:flex-end;color:color-mix(in srgb,var(--team) var(--tp),#000);padding-top:0;font-weight:800;font-size:12px}
  .today-marker .lab{grid-column:3;display:flex;align-items:center;gap:10px;color:color-mix(in srgb,var(--team) var(--tp),#000);font-weight:800;letter-spacing:.1em}
  .today-marker .lab::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:var(--team);box-shadow:0 0 12px var(--team)}
  .today-marker .lab::after{content:"";flex:1;border-top:2px dashed color-mix(in srgb,var(--team) 55%,transparent)}

  .gap-div{grid-column:1/-1;text-align:center;font-size:11.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700;padding:16px 0;display:flex;align-items:center;gap:14px;justify-content:center}
  .gap-div::before,.gap-div::after{content:"";height:1px;background:var(--line);flex:1;max-width:130px}

  /* ---------- TABLES ---------- */
  .note{color:var(--muted);font-size:13.5px;margin:-6px 0 16px}
  .tblwrap{border:1px solid var(--line);border-radius:18px;background:var(--surf);overflow:auto}
  table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:580px}
  th,td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  thead th{background:var(--surf2);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);position:sticky;top:0}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:color-mix(in srgb,var(--team) 7%,transparent)}
  tr.myrow td{background:color-mix(in srgb,var(--team) 13%,transparent);font-weight:600}
  tr.currow td{box-shadow:inset 0 2px 0 var(--team),inset 0 -2px 0 var(--team)}
  tr.currow td:first-child{box-shadow:inset 0 2px 0 var(--team),inset 0 -2px 0 var(--team),inset 3px 0 0 var(--team)}
  .rr td{text-align:center;font-weight:600}
  .rr td:first-child{color:var(--muted)}
  .rr .tm{font-weight:800;color:color-mix(in srgb,var(--pc) var(--tp),#000)}
  .rr .dash{color:var(--muted);font-weight:400;margin:0 4px}
  .rr td.mh{background:color-mix(in srgb,var(--team) 15%,transparent);box-shadow:inset 0 0 0 1.6px color-mix(in srgb,var(--team) 55%,transparent);border-radius:8px}
  .legend{padding:12px 14px;font-size:12px;color:var(--muted);line-height:2.1}
  .pill{display:inline-block;font-size:11px;font-weight:800;color:color-mix(in srgb,var(--pc,var(--muted)) var(--tp),#000);background:var(--surf2);border:1px solid var(--line);border-radius:7px;padding:1px 7px;margin-right:5px}

  /* ---------- TEAM CARDS ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
  .tcard{position:relative;overflow:hidden;background:var(--surf);border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:16px;padding:18px;transition:transform .15s ease,box-shadow .2s ease}
  .tcard:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.26)}
  .tcard.me{box-shadow:0 0 0 2px var(--tc)}
  .tcard .tn{display:flex;align-items:center;gap:11px;margin-bottom:12px}
  .tcard .tn .n{width:36px;height:36px;border-radius:11px;background:var(--tc);color:#0b0c12;font-weight:900;display:grid;place-items:center;font-size:16px;flex:none}
  .tcard .tn h3{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
  .tcard .tn .ab{font-size:11px;color:var(--muted);font-weight:700;margin-top:1px}
  .players{margin-bottom:2px}
  .player{font-size:13px;display:flex;gap:6px;flex-wrap:wrap;align-items:baseline;padding:3px 0}
  .player .lead{font-size:9px;background:var(--tc);color:#0b0c12;border-radius:5px;padding:1px 5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
  .row{display:grid;grid-template-columns:92px 1fr;gap:10px;font-size:13px;padding:8px 0;border-top:1px solid var(--line)}
  .roster{display:flex;flex-wrap:wrap;gap:6px}

  .foot{max-width:1100px;margin:0 auto;padding:0 22px 44px;color:var(--muted);font-size:11.5px;text-align:center;line-height:1.7}

  @media print{
    @page{margin:12mm}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    body{background:#fff;--bg:#fff;--surf:#fff;--surf2:#fff;--ink:#111;--muted:#555;--line:#ccc}
    header,nav.tabs,.subhead .pick,.subhead .btn,.played{display:none!important}
    main{max-width:none;padding:0}
    section{display:none!important}section#me{display:block!important}
    .hero,.tl-card{break-inside:avoid}.tl-row,.today-marker,.gap-div{break-inside:avoid}
    #printTitle{display:block!important}
  }
  #printTitle{display:none;font-size:19px;font-weight:900;margin:0 0 12px}

  @media(max-width:680px){
    /* méně místa po stranách */
    main{padding:20px 14px 72px}
    .bar{padding:11px 14px;gap:9px}
    nav.tabs{padding:0 14px}
    nav.tabs button{padding:12px 11px;font-size:13.5px}
    .foot{padding:0 14px 40px}

    /* hlavička na dva řádky: značka nahoře, výběr + přepínač pod ní */
    .spacer{display:none}
    .brand{flex:1 1 100%}
    .brand .ball{width:22px;height:22px}
    .brand>div{font-size:16px}
    .pick{flex:1;min-width:0;gap:7px}
    .pick label{flex:none}
    select{flex:1;min-width:0}
    input[type=date]{max-width:100%}

    /* hero kompaktnější */
    .hero{grid-template-columns:auto 1fr;gap:16px;padding:19px 18px;border-radius:18px}
    .numbadge{width:60px;height:60px;border-radius:15px;font-size:30px}
    .hero .name{font-size:21px}
    .hero .sub{font-size:13px}
    .hero .facts{gap:14px}
    .next{padding:13px 15px}
    .next .nx-main{font-size:16px}

    .subhead{gap:9px}
    .subhead>div{flex-wrap:wrap;gap:8px}

    /* časová osa – užší datový sloupec, menší karty */
    .tl-row,.today-marker{grid-template-columns:52px 18px 1fr;gap:9px}
    .tl-date{padding-top:15px}
    .tl-date b{font-size:12.5px}
    .tl-date span{font-size:10px}
    .tl-card{padding:13px 14px;border-radius:14px;margin:7px 0}
    .mcard{padding-left:15px}
    .ghost{font-size:54px;top:-8px;right:8px}
    .opp{font-size:18px}
    .mc-team{gap:9px;margin:11px 0}
    .info{font-size:12.5px;gap:9px}
    .rp{font-size:11.5px}
  }
  @media(max-width:380px){
    main{padding:16px 10px 60px}
    .bar,nav.tabs{padding-left:12px;padding-right:12px}
    .hero{grid-template-columns:1fr}
    .tl-row,.today-marker{grid-template-columns:46px 16px 1fr;gap:7px}
    .tl-date b{font-size:12px}
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><span class="ball" aria-hidden="true"></span><div>6. liga · stolní tenis<small>Los &amp; termínový kalendář — 2026/27 — Brno</small></div></div>
    <div class="spacer"></div>
    <div class="pick"><label for="teamSel">Můj tým</label><select id="teamSel"><option value="">— vyber —</option></select></div>
    <button id="themeBtn" class="btn iconbtn" title="Přepnout světlý / tmavý režim"></button>
  </div>
  <nav class="tabs">
    <button data-tab="me" class="on">Můj tým</button>

function pd(iso){const[a,b,c]=iso.split('-').map(Number);return new Date(a,b-1,c);}
function fmtRange(s,e){const a=pd(s),b=pd(e),y=b.getFullYear();

  return a.getDate()+'. '+(a.getMonth()+1)+'. – '+b.getDate()+'. '+(b.getMonth()+1)+'. '+y;}
const MON3=['','led','úno','bře','dub','kvě','čvn','čvc','srp','zář','říj','lis','pro'];
// kompaktní svislé datum pro osu: rozsah dnů / měsíc / rok pod sebou
function dateCell(s,e){const a=pd(s),b=pd(e),y=b.getFullYear(),m1=a.getMonth()+1,m2=b.getMonth()+1;
  const top = m1===m2 ? `${a.getDate()}.–${b.getDate()}.` : `${a.getDate()}. ${m1}.`;
  const mid = m1===m2 ? MON3[m1] : `– ${b.getDate()}. ${m2}.`;
  return `<b>${top}</b><span>${mid}</span><span class="yr">${y}</span>`;}
function today0(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function toISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

          <div class="ghost">${w.round}</div>
          <div class="mc-top">
            <span class="round"><b>${w.round}.</b> kolo <i>${half}</i></span>
            ${isCur?'<span class="flag">tento týden</span>':''}${isNext?'<span class="flag">příští týden</span>':''}
          </div>
          <div class="mc-team">
            <span class="ha ${m.home?'home':'away'}">${m.home?IC.home+' doma':IC.away+' venku'}</span>
            <span class="opp"><span class="dotnum">${opp.n}</span>${opp.name}</span>
          </div>
          <div class="infogrid">
            <div class="info">${IC.pin}<span>${where}</span></div>
            <div class="info">${IC.clock}<span>${day} · ${time}</span></div>
            <div class="info">${IC.user}<span>${opp.players[0].name} · <a href="tel:${opp.players[0].phone.replace(/ /g,'')}">${opp.players[0].phone}</a> · <a href="mailto:${opp.players[0].mail}">${opp.players[0].mail}</a></span></div>
            ${m.home?`<div class="info alt">${IC.home}<span>Soupeř hraje doma: ${opp.day} · ${opp.time} · ${opp.venue}</span></div>`:''}
          </div>
          <div class="roster-line">${IC.squad}<span class="rlist">${opp.roster.map(p=>`<span class="rp">${sexIco(p.sex)}${p.name}${wlHtml(p)}</span>`).join('')}</span></div>
          ${lastHtml(opp)}
          <div class="mc-foot"><label class="played"><input type="checkbox" ${isPlayed(w.round)?'checked':''} onchange="togglePlayed(${w.round},this)"><span class="switch"></span><span class="pl-txt">Odehráno</span></label></div>
        </div>
      </div>`;
    } else {
      const isHol=w.type==='holiday';
      html+=`<div class="tl-row">
        <div class="tl-date">${dateCell(w.s,w.e)}</div>
        <div class="tl-axis"><div class="dot ${isHol?'holiday':'nt'}"></div></div>
        <div class="tl-card slim ${isHol?'holiday':'freewk'} ${curCls}">
          <div class="r1">${isHol?'Jarní prázdniny':'Volný týden — náhradní termíny (NT)'}
            ${isCur?'<span class="flag">tento týden</span>':''}${isNext?'<span class="flag">příští týden</span>':''}</div>
          <div class="r2">${w.note||'dohrávky zápasů, které se nestihly odehrát v řádném termínu'}</div>
        </div>
      </div>`;
    }
  });
  if(seasonOver) html+=`<div class="tl-card slim"><div class="r1">Sezóna 2026/27 skončila 🏁</div></div>`;
  if(beforeStart) html=`<div class="tl-card slim" style="margin-bottom:8px"><div class="r1">Sezóna zatím nezačala — start ${fmtRange(WEEKS[0].s,WEEKS[0].e)}</div></div>`+html;
  box.innerHTML='<div class="timeline">'+html+'</div>';
}

/* ---------- DRAW ---------- */
function renderDraw(){
  const now=today0();
  let curRound=0;const uw=WEEKS.find(w=>w.type==='round'&&pd(w.e)>=now);if(uw)curRound=uw.round;
  let rows='';
  for(let r=1;r<=18;r++){
    const half=r<=9?'I':'II';
    const cells=pairsForRound(r).map(([h,a])=>{
      const mine=(h===myTeam||a===myTeam);
      return `<td class="${mine?'mh':''}"><span class="tm" style="--pc:${tc(h)}">${T[h].ab}</span><span class="dash">–</span><span class="tm" style="--pc:${tc(a)}">${T[a].ab}</span></td>`;
    }).join('');
    rows+=`<tr class="rr ${r===curRound?'currow':''}"><td><b>${r}.</b><br><span style="font-size:10px;color:var(--muted)">${half}. pol.</span></td>${cells}</tr>`;
  }
  document.getElementById('drawTbl').innerHTML=`<table>
    <thead><tr><th style="text-align:center">Kolo</th><th colspan="5">Zápasy — domácí – hosté</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <div class="legend">${TEAMS.map(t=>`<span class="pill" style="--pc:${tc(t.n)}">${t.ab}</span>${t.n}. ${t.name}`).join('&nbsp;&nbsp; ')}</div>`;
}

/* ---------- TEAMS ---------- */
function renderTeams(){
  document.getElementById('teamGrid').innerHTML=TEAMS.map(t=>`
    <div class="tcard ${t.n===myTeam?'me':''}" style="--tc:${tc(t.n)}">
      <div class="tn"><div class="n">${t.n}</div><div><h3>${t.name}</h3><div class="ab">${t.ab}</div></div></div>
      <div class="players">
        ${t.players.map(p=>`<div class="player"><b>${p.name}</b>${p.lead?'<span class="lead">ved.</span>':''} · <a href="tel:${p.phone.replace(/ /g,'')}">${p.phone}</a> · <a href="mailto:${p.mail}">${p.mail}</a></div>`).join('')}
      </div>
      <div class="row"><span class="lab" style="align-self:start;padding-top:2px">Loni</span><span>${t.last?`${t.last.lg}. liga · ${t.last.pos}. místo · <span class="w">${t.last.w}</span> V · <span class="d">${t.last.d}</span> R · <span class="l">${t.last.l}</span> P`:'—'}</span></div>
      <div class="row"><span class="lab" style="align-self:start;padding-top:2px">Soupiska</span><span><div class="roster">${t.roster.map(p=>`<span class="rp">${sexIco(p.sex)}${p.name}${wlHtml(p)}</span>`).join('')}</div></span></div>
      <div class="row"><span class="lab" style="align-self:start;padding-top:2px">Herna</span><span>${t.venue}</span></div>
      <div class="row"><span class="lab" style="align-self:start;padding-top:2px">Hrací den</span><span>${t.day} · ${t.time}</span></div>
      <div class="row"><span class="lab" style="align-self:start;padding-top:2px">Stoly</span><span>${t.gear}</span></div>
      <div class="row"><span class="lab" style="align-self:start;padding-top:2px">Míčky</span><span>${t.ball}</span></div>
    </div>`).join('');
}

document.getElementById('genderLegend').innerHTML=`${sexIco('M')} muž &nbsp; ${sexIco('Z')} žena`;
function renderAll(){applyTeamColor();renderHero();renderTimeline();renderDraw();renderTeams();}
document.getElementById('foot').textContent='Zdroj: Los_kalendar_adresar_6_liga_2026-2027_FINAL.xlsx · soupisky a tabulky pinec.info · Za STK: Ing. Anna Babjaková · 604 509 449 · ab2007ab@gmail.com';
renderAll();
</script>
